# Production-style stack: pull a pre-built image from GitHub Container Registry.
services:
  # Distroless image runs as nonroot (65532:65532); Docker named volumes are root-owned by default.
  findus-data-init:
    image: busybox:1.36
    volumes:
      - findus_data:/data
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    restart: "no"

  findus:
    image: ghcr.io/bueckerlars/findus:latest
    ports:
      - "8080:8080"
    environment:
      FINDUS_BASE_URL: http://localhost:8080
      FINDUS_COOKIE_SECURE: "false"
      FINDUS_LOG_LEVEL: info
      FINDUS_LOG_FORMAT: json
    volumes:
      - findus_data:/data

volumes:
  findus_data:
