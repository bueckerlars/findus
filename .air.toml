root = "."
tmp_dir = "tmp"

[build]
  entrypoint = ["./tmp/findus"]
  cmd = "go build -o ./tmp/findus ./cmd/findus"
  delay = 200
  exclude_dir = ["tmp", "bin", "data", "node_modules", "vendor", ".git", "dist"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "html", "tmpl", "tpl", "css", "sql"]
  kill_delay = "0s"
  log = "tmp/air-build-errors.log"
  send_interrupt = true
  stop_on_error = false

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
